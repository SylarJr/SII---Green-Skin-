<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Captura de Calificaciones</title>
    <link rel="stylesheet" href="/proyecto/style.css">
    <link rel="icon" type="image/png" href="/proyecto/Imagenes/tecnm.png">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-logo-left-container">
            <img src="/proyecto/Imagenes/TecNM_logo.png" class="navbar-left-logo" alt="Logo TecNM">
        </div>
        
        <ul class="nav-links">
            <li><a href="profesores.html">Inicio</a></li>
            <li class="dropdown">
                <a href="#" class="dropbtn">Gestión <span class="arrow">▼</span></a>
                <ul class="dropdown-content">
                    <li><a href="CapCalificaciones.html">Capturar Notas</a></li>
                    <li><a href="Mis_Materias.html">Mis Materias</a></li>
                </ul>
            </li>
            <li><a href="../Inicial.html">Cerrar Sesión</a></li>
        </ul>

        <div class="navbar-logo-right-container">
            <img src="/proyecto/Imagenes/itlm.png" class="navbar-right-logo" alt="Logo ITLM">
        </div>
    </nav>

    <main class="main-content" style="padding-top: 120px; padding-bottom: 80px;">
        <div class="glass-card glass-card-wide">
            <h1>Captura de Calificaciones</h1>
            <p style="margin-bottom: 20px; color: #555;">Ingresa los resultados por unidad académica</p>
            
            <div class="table-container">
                <table class="grades-table">
                    <thead>
                        <tr>
                            <th>Alumno</th>
                            <th>Materia</th>
                            <th>Unidad 1</th>
                            <th>Unidad 2</th>
                            <th>Unidad 3</th>
                            <th>Unidad 4</th>
                            <th>Unidad 5</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-calificaciones-body">
                        <tr>
                            <td colspan="7" style="text-align: center;">Cargando lista de alumnos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="button-group">
                <button type="button" class="submit-btn" style="background-color: #555;" onclick="window.location.href='Mis_Materias.html'">Cancelar</button>
                <button type="button" id="btn-guardar-notas" class="submit-btn">Guardar Cambios</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="../conexion_db.js"></script> 
    <script src="logica_calificaciones.js"></script>

</body>
</html>
