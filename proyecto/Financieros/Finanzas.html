<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas - Captura de Pagos</title>
    <link rel="stylesheet" href="/proyecto/style.css">
    <link rel="icon" type="image/png" href="Imagenes/tecnm.png">
</head>
<body>

<nav class="navbar">
        <div class="navbar-logo-left-container">
            <img src="/proyecto/Imagenes/TecNM_logo.png" class="navbar-left-logo" alt="Logo TecNM">
        </div>
        
        <ul class="nav-links">
            <li class="dropdown">
                <a href="#" class="dropbtn">Gestión de Pagos <span class="arrow">▼</span></a>
                <ul class="dropdown-content">
                    <li><a href="Finanzas.html" style="color: #265b17; font-weight: bold;">Registrar Pagos</a></li>
                    <li><a href="ConsultarPagos.html">Ver Historial de Pagos</a></li>
                </ul>
            </li>
            <li><a href="/proyecto/Inicial.html">Cerrar Sesión</a></li>
        </ul>

        <div class="navbar-logo-right-container">
            <img src="/proyecto/Imagenes/itlm.png" class="navbar-right-logo" alt="Logo ITLM">
        </div>
    </nav>

    <main class="main-content" style="padding-top: 120px; padding-bottom: 80px; flex-direction: column; gap: 30px;">
        
        <div class="glass-card" style="max-width: 500px; width: 95%;">
            <h1>Registro de Nuevo Pago</h1>
            <p style="margin-bottom: 20px; color: #555;">Captura el cobro del trámite solicitado por el alumno.</p>
            
            <form id="form-captura-pago" class="login-form active">
                <div class="input-group">
                    <label for="no_control">Número de Control del Alumno</label>
                    <input type="text" id="no_control" placeholder="Ej: 21100234" required>
                </div>

                <div class="input-group">
                    <label for="concepto">Concepto del Pago</label>
                    <select id="concepto" class="select-input" required>
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="Inscripción">Inscripción</option>
                        <option value="Constancia">Constancia</option>
                        <option value="Duplicado de credencial">Duplicado de credencial</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="monto">Monto ($)</label>
                    <input type="number" step="0.01" id="monto" placeholder="Ej: 250.00" required>
                </div>

                <div class="button-group" style="width: 100%; max-width: none;">
                    <button type="submit" class="submit-btn" style="width: 100%; max-width: none;">Guardar Pago</button>
                </div>
            </form>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../conexion_db.js"></script> 
    <script src="captura_pagos.js"></script>
</body>
</html>
