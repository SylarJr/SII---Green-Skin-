<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas - Captura de Pagos</title>
    <link rel="stylesheet" href="/proyecto/style.css">
        <link rel="icon" type="image/png" href="/proyecto/Imagenes/tecnm.png">
</head>
<body>

<nav class="navbar">
        <div class="navbar-logo-left-container">
            <img src="/proyecto/Imagenes/TecNM_logo.png" class="navbar-left-logo" alt="Logo TecNM">
        </div>
        
        <ul class="nav-links">
            <li class="dropdown">
                <a href="#" class="dropbtn">Gestión de Pagos <span class="arrow">▼</span></a>
                <ul class="dropdown-content">
                    <li><a href="Finanzas.html" style="color: #265b17; font-weight: bold;">Registrar Pagos</a></li>
                    <li><a href="ConsultarPagos.html">Ver Historial de Pagos</a></li>
                </ul>
            </li>
            <li><a href="/proyecto/Inicial.html">Cerrar Sesión</a></li>
        </ul>

        <div class="navbar-logo-right-container">
            <img src="/proyecto/Imagenes/itlm.png" class="navbar-right-logo" alt="Logo ITLM">
        </div>
    </nav>

    <main class="main-content" style="padding-top: 120px; padding-bottom: 80px; flex-direction: column; gap: 30px;">
        
        <div class="glass-card" style="max-width: 500px; width: 95%;">
            <h1>Registro de Nuevo Pago</h1>
            <p style="margin-bottom: 20px; color: #555;">Captura el cobro del trámite solicitado por el alumno.</p>
            
            <<form id="form-buscar-pago" class="login-form active">
    <div class="input-group">
        <label for="no_control_busqueda">Número de Control del Alumno</label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="no_control_busqueda" placeholder="Ej: 26712034" required>
            <button type="button" class="submit-btn" style="width: auto;" onclick="buscarPagoPendiente()">Buscar</button>
        </div>
    </div>
</form>

<div id="contenedor-resultados-pendientes" style="display: none; margin-top: 20px; text-align: left;">
    <h3 style="color: #1b4d5f; margin-bottom: 15px;">Trámites Pendientes del Alumno</h3>
    
    <div class="table-container">
        <table class="grades-table">
            <thead>
                <tr>
                    <th>Folio</th>
                    <th>Concepto</th>
                    <th>Monto</th>
                    <th style="text-align: center;">Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-pendientes-body">
                </tbody>
        </table>
    </div>
</div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../conexion_db.js"></script> 
    <script src="captura_pagos.js"></script>
</body>
</html>
