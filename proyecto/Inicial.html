<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <!-- Corrección: La etiqueta correcta es link -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="main-content">

    <div class="glass-card">
        <div class="login-header">
            <h2>Bienvenido</h2>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('admin', this)">Personal</button>
                <button class="tab-btn" onclick="switchTab('alumno', this)">Alumnos</button>
            </div>
        </div>

        <!-- Formulario Administrativo -->
        <form id="form-admin" class="login-form active">
            <div class="input-group">
                <label>Usuario Administrativo</label>
                <input type="text" placeholder="Ej: admin_01" required>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" placeholder="********" required>
            </div>
            <button type="submit" class="submit-btn">Entrar como Personal</button>
        </form>

        <!-- Formulario Alumnos -->
        <form id="form-alumno" class="login-form">
            <div class="input-group">
                <label>Matrícula</label>
                <input type="text" placeholder="Tu matrícula" required>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" placeholder="********" required>
            </div>
            <button type="submit" class="submit-btn">Entrar como Alumno</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
