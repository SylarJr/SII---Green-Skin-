<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (sessionStorage.getItem('sesion_activa') === 'true') {
            const rol = sessionStorage.getItem('rol_usuario');
            if (rol === 'alumno') {
                window.location.replace('alumnos/alumnos.html');
            } else if (rol === 'profesor') {
                window.location.replace('profesores/profesores.html');
            } else if (rol === 'aspirante') {
                window.location.replace('aspirantes/aspirantes.html');
            }
        }
    </script>
</head>
<body class="main-content">

    <div class="glass-card">
        <div class="login-header">
            <h2>Bienvenido</h2>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('admin', this)">Personal</button>
                <button class="tab-btn" onclick="switchTab('alumno', this)">Alumnos</button>
                <button class="tab-btn" onclick="switchTab('aspirante', this)">Aspirantes</button>
            </div>
        </div>

        <form id="form-admin" class="login-form active">
            <div class="input-group">
                <label>Usuario Administrativo</label>
                <input type="text" id="admin_usuario" placeholder="Ej: admin_01" required>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="admin_pass" placeholder="********" required>
            </div>
            <button type="submit" class="submit-btn">Entrar como Personal</button>
        </form>

        <form id="form-alumno" class="login-form">
            <div class="input-group">
                <label>Matrícula</label>
                <input type="text" id="alumno_matricula" placeholder="Tu matrícula" required>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="alumno_pass" placeholder="********" required>
            </div>
            <button type="submit" class="submit-btn">Entrar como Alumno</button>
        </form>

        <form id="form-aspirante" class="login-form">
            <div class="input-group">
                <label>CURP</label>
                <input type="text" id="aspirante_curp" placeholder="Ingresa tu CURP" maxlength="18" style="text-transform: uppercase;" required>
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="aspirante_pass" placeholder="********" required>
            </div>
            <button type="submit" class="submit-btn">Ingresar</button>
            <br>
            <a href="aspirantes/aspirantes.html">
                <button type="button" class="submit-btn">Nueva solicitud</button>
            </a>
            <br>
            <button type="button" class="submit-btn">Recuperar contraseña</button>
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="conexion_db.js"></script>
    
    <script src="script.js"></script>
</body>
</html>>
